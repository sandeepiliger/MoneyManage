name: Android debug build

# Builds a debug APK on a GitHub-hosted runner, which has normal internet
# access to Google's Maven repositories. The sandbox this repo is normally
# developed in has dl.google.com blocked by org policy, so this workflow is
# the only place the :app module actually gets compiled and packaged.

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed only by the "Publish installable APKs" step below, which writes a release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest image already ships the Android SDK, with its licences accepted, at
      # /usr/local/lib/android/sdk. android-actions/setup-android@v3 was only re-exporting those
      # paths -- and it began failing outright, in six seconds and before a line of Kotlin was
      # read, once the runners forced actions off Node 20. Since CI is the only thing that
      # compiles :app in this project, a third-party action in that position is a single point of
      # failure for the whole repository, so the paths are exported directly instead.
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "No Android SDK found at $SDK" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install required SDK packages
        run: |
          # Licences are pre-accepted in the image, but a package it does not already carry needs
          # them agreed again; failing that quietly is fine, the install below is what must work.
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run :core tests
        run: ./gradlew -Pkhaata.androidModule=false :core:test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # The :app unit tests were written and then never run: nothing in this workflow executed
      # them, so they proved nothing and could rot without anyone noticing. They cover the restore
      # state machine -- the one action in this app that can destroy months of records -- which is
      # exactly the kind of thing a decorative test suite is worst at protecting.
      - name: Run :app unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload :app test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: khaata-app-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

      # The debug APK runs unminified and debuggable, which makes Compose scrolling markedly
      # slower than what a user would actually get. This is the same code built the way it ships
      # -- R8, resource shrinking, no debug flag -- signed with the debug key purely so it can be
      # sideloaded. This is the build to judge performance on.
      #
      # app/build.gradle.kts configures a lint baseline that has never existed: lint has never run
      # on this module before (assembleDebug never triggers it; this is the first assembleRelease).
      # AGP's default behaviour on a missing baseline is to write one and abort the build so nobody
      # accepts it unreviewed -- -Dlint.baselines.continue=true is AGP's own documented flag for
      # bootstrapping that baseline instead of failing outright. The generated file is then printed
      # into this log (echo, not the artifact upload below) because the log is the only channel
      # this Claude Code session can actually read back -- the artifact download URL is Azure Blob
      # Storage, which is blocked by this org's egress policy the same way dl.google.com is.
      # -Pkhaata.allowPlaceholderRelease=true is required because this runner has no
      # secrets.properties, so the AdMob unit ids and the privacy/terms URLs are still the
      # development placeholders. verifyReleaseConfig blocks a release build carrying those by
      # default; this APK exists to measure performance and prove the optimised build compiles,
      # and is never uploaded to Play, so opting out is correct here and only here.
      - name: Assemble optimised (release) APK
        run: |
          ./gradlew :app:assembleRelease \
            -Pkhaata.debugSignRelease=true \
            -Pkhaata.allowPlaceholderRelease=true \
            -Dlint.baselines.continue=true --stacktrace

      - name: Print generated lint baseline
        if: always()
        run: |
          if [ -f app/lint-baseline.xml ]; then
            echo "::group::app/lint-baseline.xml"
            cat app/lint-baseline.xml
            echo "::endgroup::"
          else
            echo "No app/lint-baseline.xml was generated."
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khaata-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload optimised APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khaata-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # Actions artifacts are always delivered as a zip, even when they hold a single file, and
      # Android's built-in Downloads extractor cannot open the zips GitHub produces -- it reports
      # "Could not extract file. Error unknown" and there is nothing wrong with the APK inside.
      # A phone cannot install an APK it cannot get out of the container, so the same APKs are
      # also attached to a rolling prerelease, where the browser downloads a raw .apk that installs
      # on tap. The artifacts above stay as they are: they are what this Claude Code session and
      # any desktop checkout use.
      #
      # gh is preinstalled on GitHub-hosted runners. Deliberately not a third-party release action:
      # this workflow is the only place :app is ever compiled, and it has already been taken out
      # once by a third-party action breaking (see "Set up Android SDK" above).
      #
      # continue-on-error because publishing is a convenience, not a build result. If a repository
      # or org policy refuses the release write, that must not turn a green build red -- the
      # artifacts are still there to fall back on.
      - name: Publish installable APKs
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          mkdir -p dist

          # Named by build type and commit, because "app-debug.apk" in a Downloads folder tells
          # you nothing about which build you are holding.
          cp app/build/outputs/apk/debug/*.apk "dist/khaata-debug-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/release/*.apk "dist/khaata-optimised-${SHORT_SHA}.apk"

          NOTES=$(cat <<EOF
          Build \`${SHORT_SHA}\` from \`${GITHUB_REF_NAME}\`, $(date -u '+%Y-%m-%d %H:%M UTC').

          **khaata-debug-${SHORT_SHA}.apk** — debuggable and unminified. Use this for trying
          features out. Compose scrolling is slower here than in a real release build.

          **khaata-optimised-${SHORT_SHA}.apk** — the same code built the way it ships (R8,
          resource shrinking). Judge performance on this one.

          The two install side by side as separate apps with separate data: the debug build carries
          a \`.debug\` application id. Entering transactions in one will not show them in the other.

          **Paid features can only be unlocked in the debug build**, under Settings → Developer →
          Simulated tier. That section is compiled out of the optimised build, which reaches the
          real Play billing that has no products configured yet — so receipts, scheduled backup
          and dashboard customisation stay locked there with no way through. Test features on
          debug; use optimised only to judge how the app performs.

          Both are signed with the standard Android debug key so they can be sideloaded. Neither is
          a Play build, and they cannot be installed over a Play-signed copy of the app.

          Tap an .apk below on the phone to install it. Android will ask for permission to install
          from your browser the first time.
          EOF
          )

          # Rolling: the link stays the same build to build, so there is one place to go for the
          # newest APK. Recreated rather than updated so assets from older commits do not pile up
          # and leave two builds with no obvious newest.
          gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-build \
            --prerelease \
            --title "Latest build (${SHORT_SHA})" \
            --notes "${NOTES}" \
            dist/*.apk

          echo "Installable APKs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/latest-build"

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/lint-baseline.xml
            **/build/test-results/**/*.xml
          retention-days: 14
