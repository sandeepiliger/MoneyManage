name: Android debug build

# Builds a debug APK on a GitHub-hosted runner, which has normal internet
# access to Google's Maven repositories. The sandbox this repo is normally
# developed in has dl.google.com blocked by org policy, so this workflow is
# the only place the :app module actually gets compiled and packaged.

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run :core tests
        run: ./gradlew -Pkhaata.androidModule=false :core:test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # The debug APK runs unminified and debuggable, which makes Compose scrolling markedly
      # slower than what a user would actually get. This is the same code built the way it ships
      # -- R8, resource shrinking, no debug flag -- signed with the debug key purely so it can be
      # sideloaded. This is the build to judge performance on.
      #
      # app/build.gradle.kts configures a lint baseline that has never existed: lint has never run
      # on this module before (assembleDebug never triggers it; this is the first assembleRelease).
      # AGP's default behaviour on a missing baseline is to write one and abort the build so nobody
      # accepts it unreviewed -- -Dlint.baselines.continue=true is AGP's own documented flag for
      # bootstrapping that baseline instead of failing outright. The generated file is then printed
      # into this log (echo, not the artifact upload below) because the log is the only channel
      # this Claude Code session can actually read back -- the artifact download URL is Azure Blob
      # Storage, which is blocked by this org's egress policy the same way dl.google.com is.
      - name: Assemble optimised (release) APK
        run: |
          ./gradlew :app:assembleRelease -Pkhaata.debugSignRelease=true -Dlint.baselines.continue=true --stacktrace

      - name: Print generated lint baseline
        if: always()
        run: |
          if [ -f app/lint-baseline.xml ]; then
            echo "::group::app/lint-baseline.xml"
            cat app/lint-baseline.xml
            echo "::endgroup::"
          else
            echo "No app/lint-baseline.xml was generated."
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khaata-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload optimised APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khaata-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/lint-baseline.xml
            **/build/test-results/**/*.xml
          retention-days: 14
